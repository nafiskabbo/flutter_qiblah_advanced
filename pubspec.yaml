name: flutter_qiblah_advanced
description: Flutter Qiblah direction with compass and location support for Android and iOS.
version: 4.0.1
homepage: https://github.com/nafiskabbo/flutter_qiblah_advanced
repository: https://github.com/nafiskabbo/flutter_qiblah_advanced
issue_tracker: https://github.com/nafiskabbo/flutter_qiblah_advanced/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_device_compass: ^2.0.1
  geolocator: ^14.0.2
  stream_transform: ^2.1.1
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: ml.medyas.flutter_qiblah
        pluginClass: FlutterQiblahPlugin
      ios:
        pluginClass: FlutterQiblahPlugin
